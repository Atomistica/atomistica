name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # needed for setuptools-scm version detection

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qy
        sudo apt-get install -y liblapack-dev ninja-build

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install lapack ninja

    - name: Install Python build / test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install meson ninja meson-python setuptools-scm ase pytest

    # -----------------------------------------------------------------------
    # 1. C++ unit tests (Catch2) — build lib/ standalone
    # -----------------------------------------------------------------------
    - name: Configure C++ unit tests
      run: |
        cd lib
        meson setup build \
          -Denable_tests=true \
          -Denable_python=false \
          --wipe

    - name: Build C++ unit tests
      run: ninja -C lib/build tests/atomistica_tests

    - name: Run C++ unit tests
      run: lib/build/tests/atomistica_tests --reporter compact

    # -----------------------------------------------------------------------
    # 2. Build wheel and run Python tests
    # -----------------------------------------------------------------------
    - name: Build wheel
      run: python -m build --no-isolation -w

    - name: Install wheel
      run: |
        WHEEL=$(find dist -name "*.whl" | head -1)
        pip install "$WHEEL"

    - name: Verify import
      run: |
        python -c "import atomistica; print('atomistica', atomistica.__version__)"
        python -c "from atomistica import Tersoff, Brenner, REBO2, TabulatedEAM, DFTB"

    - name: Run Python tests
      run: pytest tests/ -v

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl
